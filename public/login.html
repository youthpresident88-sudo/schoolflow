<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — SchoolFlow</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app.css"></head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-brand"><span class="brand-mark">SF</span><h1>SchoolFlow</h1><p>One platform for your entire school.</p></div>
    <form class="auth-card" id="loginForm" onsubmit="login(event)">
      <h2>Sign in</h2><p class="muted" id="loginSub">Staff and parents sign in here.</p>
      <label>Email<input id="email" type="email" required placeholder="you@school.edu.gh" autocomplete="username"></label>
      <label>Password<input id="password" required type="password" placeholder="••••••••" autocomplete="current-password"></label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
      <p class="switch" id="applyLink" style="display:none"><a id="applyA" href="apply.html">Applying for admission? Apply online</a></p>
      <p class="switch">New school? <a href="onboarding.html">Create a school account</a></p>
    </form>
  </div>
  <script src="js/api.js"></script>
  <script src="app.js"></script>
</body></html>
